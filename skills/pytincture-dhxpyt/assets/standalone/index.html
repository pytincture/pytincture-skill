<!DOCTYPE html>
<!--
  Standalone browser mode: ordinary static HTML, no Pytincture service, no BFF,
  no server authentication, no private Python.

  Prepare the verified local runtime once, on the machine that builds the site:

      python -m pip install 'pytincture==1.0.0rc5'
      python -m pytincture.assets ./frontend

  Then serve the directory over HTTP(S) -- not file:// --  e.g.:

      python3 -m http.server 8000

  Everything in this page is visible to the user. Never embed credentials and
  never treat browser Python as a trusted authorization layer; use service mode
  for that.
-->
<html>
  <head>
    <meta charset="utf-8">
    <title>Pytincture standalone app</title>
    <script>
      window.pytinctureAutoStartConfig = {
        mode: "inline",
        entrypoint: "Demo",
        // Exact pin required. dhxpyt 0.9.18 is the release Pytincture 1.0 locks.
        widgetlib: "dhxpyt==0.9.18",
        onLifecycleEvent: event => console.debug(event.stage, event.type)
      };
      // window.pytinctureAutoStartDisabled = true;  // to call runTinctureApp() yourself
    </script>
    <script src="./frontend/dist/pytincture.min.js"></script>
  </head>
  <body>
    <div id="maindiv" style="width: 100%; height: 100vh;"></div>

    <!--
      Every entry must be an exact `name==version` pin, or a wheel URL ending in
      #sha256=<64 hex>. Automatic dependency resolution is disabled, so list
      every required package. Packages must be pure Python or ship a
      Pyodide-compatible wheel.
    -->
    <script type="text/json" id="micropip-libs">
      ["faker==37.0.0"]
    </script>

    <script type="text/python">
from dhxpyt.layout import MainWindow


class Demo(MainWindow):
    # Implement load_ui() only. dhxpyt's LoadUICaller metaclass calls it once
    # the class is constructed; calling it from __init__ builds the UI twice.
    def load_ui(self):
        self.set_theme("dark")
        self.layout = self.add_layout(
            layout_config={
                "type": "line",
                "rows": [
                    {"id": "top", "height": "auto"},
                    {"id": "body", "height": "100%"},
                ],
            }
        )
        self.layout.attach_html(id="top", html="<h1>Hello from Pytincture</h1>")
    </script>
  </body>
</html>
